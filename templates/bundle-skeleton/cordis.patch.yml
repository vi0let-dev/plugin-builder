# dsh-xxx —— bundle patch。
#
# 三处名字必须一致，改一处就要全改：
#   1. package.json 的 "name"
#   2. 下面这条 insert 的 "name"
#   3. client.js 里 __ModuleLoader__.load 的 "id"
#
# id 是组合树里的行 id，与包名保持一致最省心。
# config 的内容必须匹配 index.js 里 export 的 Config schema（若声明了的话）。
- insert:
    - id: dsh-xxx
      name: 'dsh-xxx'
      config: {}
